---
layout: default
title: Alle Blogbeiträge
permalink: /blog/
narrow: true
---

<h1>Alle Blogbeiträge</h1>
<div class="blog-list">
  {% for post in site.posts %}
    <div class="blog-list-item">
      <a class="blog-list-title" href="{{ post.url | relative_url }}">{{ post.title }}</a>
      <div class="blog-list-excerpt">{{ post.excerpt | strip_html | truncate: 140 }}</div>
      <div class="blog-list-date">{{ post.date | date: "%d.%m.%Y" }}</div>
    </div>
  {% endfor %}
</div>
